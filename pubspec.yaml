name: misi_belanja
description: >-
  Misi Belanja untuk Bpedia Demo v3. Aturan murni tahap misi, subtotal produk
  misi, dan voucher, serta halaman game siap pakai: daftar produk misi, progres
  beranimasi dengan Bipy berjalan, kupon voucher, dan perayaan tahap tuntas.
version: 3.0.0
publish_to: none
repository: https://github.com/yusufmuh/bpedia-misi-belanja

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bipy/
    - assets/art/
    - assets/fx/
